services:
  - type: web
    name: smm-bot
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot.py"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: PROVIDER_API_URL
        sync: false
      - key: PROVIDER_API_KEY
        sync: false
      - key: DEFAULT_CARD_NUMBER
        value: "8600 0000 0000 0000"
      - key: DEFAULT_CARD_HOLDER
        value: "SMM BOT ADMIN"
      - key: PORT
        value: "8080"
